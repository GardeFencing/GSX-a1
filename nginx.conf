server {
    listen 80;
    server_name analyze.gardeai.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name analyze.gardeai.com;

    ssl_certificate /etc/letsencrypt/live/analyze.gardeai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analyze.gardeai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
        
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;


        chunked_transfer_encoding on;
        
        client_max_body_size 200M;
    }

    location /static {
        alias /home/ubuntu/GSX-a1/static;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
