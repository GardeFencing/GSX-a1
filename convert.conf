; /etc/supervisor/conf.d/convert.conf

[program:convert]
directory=__GSX_A1_PATH__
command=__NODE_PATH__ __GSX_A1_PATH__/convert-video.js
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=ubuntu
stderr_logfile=__GSX_A1_PATH__/convert_stderr.log
stdout_logfile=__GSX_A1_PATH__/convert_stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
environment=NODE_ENV="production",PATH="__NODE_PATH__:%(ENV_PATH)s"

[supervisord]
logfile=__GSX_A1_PATH__/supervisord_convert.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=debug