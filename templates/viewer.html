<!DOCTYPE html>
<html>
<head>
    <title>GardeRAG Video Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/base32-decode@1.0.0/base32-decode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/base32-encode@1.2.0/base32-encode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .main-container {
            display: flex;
            gap: 20px;
        }
        .frame-container {
            flex: 1;
            border: 1px solid #ccc;
            padding: 10px;
        }
        .chat-container {
            flex: 1;
            border: 1px solid #ccc;
            padding: 10px;
        }
        .frame-controls {
            margin: 10px 0;
        }
        .frame-info {
            margin: 10px 0;
            font-size: 0.9em;
            color: #666;
        }
        .chat-messages {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #eee;
            padding: 10px;
            margin-bottom: 10px;
        }
        .chat-input {
            display: flex;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            padding: 5px;
        }
        .analysis {
            margin-top: 20px;
            padding: 10px;
            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <h1>GardeRAG Video Viewer</h1>
    
    <div class="main-container">
        <div class="frame-container">
            <img id="current-frame" src="" alt="Current Frame" style="max-width: 100%;">
            <div class="frame-controls">
                <button onclick="prevFrame()">Previous</button>
                <input type="range" id="frame-slider" min="0" max="{{ total_frames - 1 }}" value="0" oninput="updateFrame(this.value)">
                <button onclick="nextFrame()">Next</button>
            </div>
            <div class="frame-info">
                Frame: <span id="frame-number">0</span> / {{ total_frames - 1 }}
                Time: <span id="frame-timestamp">0.00</span>s
            </div>
            <div class="analysis">
                <h3>Frame Analysis</h3>
                <div id="frame-analysis"></div>
            </div>
        </div>
        
        <div class="chat-container">
            <h2>Chat</h2>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input">
                <input type="text" id="chat-input" placeholder="Ask about the video...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
    
    <script>
        let currentFrame = 0;
        let analyses = [];
        
        function base32ToImage(base32String) {
            try {
                const binaryData = base32Decode(base32String, 'RFC4648');
                const blob = new Blob([binaryData], { type: 'image/jpeg' });
                return URL.createObjectURL(blob);
            } catch (error) {
                console.error('Error converting base32 to image:', error);
                return '';
            }
        }
        
        function updateFrame(index) {
            currentFrame = parseInt(index);
            fetch(`/get_frame/${currentFrame}`)
                .then(response => response.json())
                .then(data => {
                    const imageUrl = base32ToImage(data.frame);
                    document.getElementById('current-frame').src = imageUrl;
                    document.getElementById('frame-number').textContent = data.frame_number;
                    document.getElementById('frame-timestamp').textContent = data.timestamp.toFixed(2);
                    document.getElementById('frame-slider').value = currentFrame;
                    
                    if (analyses[currentFrame]) {
                        document.getElementById('frame-analysis').textContent = analyses[currentFrame];
                    }
                })
                .catch(error => {
                    console.error('Error updating frame:', error);
                });
        }
        
        function prevFrame() {
            if (currentFrame > 0) {
                updateFrame(currentFrame - 1);
            }
        }
        
        function nextFrame() {
            if (currentFrame < {{ total_frames - 1 }}) {
                updateFrame(currentFrame + 1);
            }
        }
        
        function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;
            
            const messagesDiv = document.getElementById('chat-messages');
            messagesDiv.innerHTML += `<p><strong>You:</strong> ${message}</p>`;
            input.value = '';
            
            fetch('/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    query: message,
                    frame_index: currentFrame
                })
            })
            .then(response => response.json())
            .then(data => {
                messagesDiv.innerHTML += `<p><strong>Assistant:</strong> ${data.response}</p>`;
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            })
            .catch(error => {
                console.error('Error in chat:', error);
                messagesDiv.innerHTML += `<p class="error">Error: ${error.message}</p>`;
            });
        }
        
        // Initialize
        document.getElementById('chat-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        updateFrame(0);
    </script>
</body>
</html>
