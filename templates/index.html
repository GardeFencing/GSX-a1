<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Analysis Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .video-container {
            margin: 20px 0;
            border: 2px dashed #dee2e6;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
        }
        #videoPreview {
            max-width: 100%;
            max-height: 400px;
            margin: 20px auto;
        }
        .analysis-container {
            margin: 20px 0;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .chat-container {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .progress {
            display: none;
            margin: 20px 0;
        }
        .user-message {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border-radius: 15px;
            margin: 5px 0;
            max-width: 80%;
            margin-left: 20%;
        }
        .ai-message {
            background-color: #f1f3f5;
            padding: 10px 15px;
            border-radius: 15px;
            margin: 5px 0;
            max-width: 80%;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <h1 class="mb-4">Video Analysis Chatbot</h1>
        <p class="lead">Upload a video and ask questions about it. The AI will analyze the video and provide answers.</p>

        <div class="video-container">
            <input type="file" id="videoUpload" accept="video/*" class="form-control mb-3">
            <video id="videoPreview" controls style="display: none;"></video>
            <div class="progress">
                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar"></div>
            </div>
        </div>

        <div class="analysis-container" id="initialAnalysis" style="display: none;">
            <h4>Initial Analysis:</h4>
            <div id="analysisText"></div>
        </div>

        <div class="chat-section" style="display: none;">
            <h3>Ask Questions</h3>
            <div id="chatMessages" class="chat-container"></div>
            <div class="input-group">
                <input type="text" id="questionInput" class="form-control" placeholder="Ask a question about the video...">
                <button class="btn btn-primary" onclick="askQuestion()">Ask</button>
            </div>
        </div>

        <div class="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p>Processing video...</p>
        </div>
    </div>

    <script>
        // Handle video upload
        document.getElementById('videoUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                // Show video preview
                const video = document.getElementById('videoPreview');
                video.style.display = 'block';
                video.src = URL.createObjectURL(file);

                // Show loading
                document.querySelector('.loading').style.display = 'block';
                document.querySelector('.progress').style.display = 'flex';

                // Upload and analyze video
                const formData = new FormData();
                formData.append('video', file);

                fetch('/upload', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    // Show analysis
                    document.getElementById('initialAnalysis').style.display = 'block';
                    document.getElementById('analysisText').textContent = data.analysis;
                    // Show chat section
                    document.querySelector('.chat-section').style.display = 'block';
                    // Add initial analysis to chat
                    addMessage(data.analysis, false);
                })
                .catch(error => {
                    alert('Error: ' + error.message);
                })
                .finally(() => {
                    document.querySelector('.loading').style.display = 'none';
                    document.querySelector('.progress').style.display = 'none';
                });
            }
        });

        // Handle chat
        function addMessage(text, isUser) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = isUser ? 'user-message' : 'ai-message';
            messageDiv.textContent = text;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function askQuestion() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            
            if (!question) return;

            // Add user message
            addMessage(question, true);
            input.value = '';

            // Show loading
            document.querySelector('.loading').style.display = 'block';

            // Send question
            fetch('/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ query: question })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    throw new Error(data.error);
                }
                addMessage(data.response, false);
            })
            .catch(error => {
                addMessage('Error: ' + error.message, false);
            })
            .finally(() => {
                document.querySelector('.loading').style.display = 'none';
            });
        }

        // Handle Enter key in chat input
        document.getElementById('questionInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                askQuestion();
            }
        });
    </script>
</body>
</html>
