<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Question Answering</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .video-container {
            margin: 20px 0;
            border: 2px dashed #dee2e6;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
        }
        #videoPreview {
            max-width: 100%;
            max-height: 400px;
            margin: 20px auto;
        }
        .chat-container {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .progress {
            display: none;
            margin: 20px 0;
        }
        .parameter-slider {
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <h1 class="mb-4">Video Question Answering</h1>
        <p class="lead">Upload a video and ask questions about it. The AI will analyze the video and provide answers.</p>

        <div class="video-container">
            <input type="file" id="videoUpload" accept="video/*" class="form-control mb-3">
            <video id="videoPreview" controls style="display: none;"></video>
            <div class="progress">
                <div class="progress-bar" role="progressbar" style="width: 0%"></div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-6">
                <h3>Parameters</h3>
                <div class="parameter-slider">
                    <label>Temperature: <span id="tempValue">0.7</span></label>
                    <input type="range" class="form-range" min="0.01" max="1.99" step="0.01" value="0.7" id="temperature">
                </div>
                <div class="parameter-slider">
                    <label>Top P: <span id="topPValue">0.8</span></label>
                    <input type="range" class="form-range" min="0" max="1" step="0.1" value="0.8" id="topP">
                </div>
                <div class="parameter-slider">
                    <label>Top K: <span id="topKValue">100</span></label>
                    <input type="range" class="form-range" min="0" max="1000" step="10" value="100" id="topK">
                </div>
                <div class="parameter-slider">
                    <label>Max Tokens: <span id="maxTokensValue">512</span></label>
                    <input type="range" class="form-range" min="1" max="4096" step="1" value="512" id="maxTokens">
                </div>
            </div>
            <div class="col-md-6">
                <h3>Chat</h3>
                <div id="chatMessages" class="chat-container"></div>
                <div class="input-group">
                    <input type="text" id="questionInput" class="form-control" placeholder="Ask a question about the video...">
                    <button class="btn btn-primary" onclick="askQuestion()">Ask</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Update parameter values
        document.querySelectorAll('.form-range').forEach(range => {
            range.addEventListener('input', function() {
                document.getElementById(this.id + 'Value').textContent = this.value;
            });
        });

        // Video upload and preview
        document.getElementById('videoUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const video = document.getElementById('videoPreview');
                video.style.display = 'block';
                video.src = URL.createObjectURL(file);

                // Upload the video
                uploadVideo(file);
            }
        });

        function uploadVideo(file) {
            const formData = new FormData();
            formData.append('video', file);

            const progress = document.querySelector('.progress');
            const progressBar = progress.querySelector('.progress-bar');
            progress.style.display = 'flex';

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    addMessage('error', `Error: ${data.error}`);
                } else {
                    addMessage('system', 'Video uploaded and processed successfully!');
                }
            })
            .catch(error => {
                addMessage('error', `Error: ${error.message}`);
            })
            .finally(() => {
                progress.style.display = 'none';
            });
        }

        function addMessage(type, text) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `alert ${type === 'user' ? 'alert-primary' : type === 'error' ? 'alert-danger' : 'alert-success'} mb-2`;
            messageDiv.textContent = text;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function askQuestion() {
            const question = document.getElementById('questionInput').value.trim();
            if (!question) return;

            addMessage('user', question);
            document.getElementById('questionInput').value = '';

            const params = {
                query: question,
                temperature: parseFloat(document.getElementById('temperature').value),
                top_p: parseFloat(document.getElementById('topP').value),
                top_k: parseInt(document.getElementById('topK').value),
                max_tokens: parseInt(document.getElementById('maxTokens').value)
            };

            fetch('/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(params)
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    addMessage('error', `Error: ${data.error}`);
                } else {
                    addMessage('system', data.response);
                }
            })
            .catch(error => {
                addMessage('error', `Error: ${error.message}`);
            });
        }

        // Handle Enter key in question input
        document.getElementById('questionInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                askQuestion();
            }
        });
    </script>
</body>
</html>
