[program:vidclip]
directory=/home/ubuntu/GSX-a1
command=/home/ubuntu/GSX-a1/venv_py310/bin/gunicorn --workers 4 --bind 0.0.0.0:5000 --timeout 120 --log-level debug server:app
user=ubuntu
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/supervisor/vidclip.err.log
stdout_logfile=/var/log/supervisor/vidclip.out.log
environment=PYTHONUNBUFFERED=1,PATH="/home/ubuntu/GSX-a1/venv_py310/bin:%(ENV_PATH)s",PYTHONPATH="/home/ubuntu/GSX-a1",LANG=en_US.UTF-8,LC_ALL=en_US.UTF-8

[supervisord]
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info