[program:vidclip]
directory=/home/ubuntu/VidCLIPChatbot
command=/home/ubuntu/VidCLIPChatbot/venv/bin/gunicorn -w 4 -b 0.0.0.0:5000 server:app
user=ubuntu
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/supervisor/vidclip.err.log
stdout_logfile=/var/log/supervisor/vidclip.out.log
environment=
    PATH="/home/ubuntu/VidCLIPChatbot/venv/bin",
    PYTHONPATH="/home/ubuntu/VidCLIPChatbot",
    FLASK_ENV="production"

[supervisord]
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10 