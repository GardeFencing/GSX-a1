[program:vidclip]
directory=/home/ubuntu/GSX-a1
command=/home/ubuntu/GSX-a1/venv/bin/gunicorn --workers 4 --worker-class gevent --bind 0.0.0.0:5000 --timeout 120 --log-level info server:app
user=ubuntu
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/supervisor/vidclip.err.log
stdout_logfile=/var/log/supervisor/vidclip.out.log
environment=
    PATH="/home/ubuntu/GSX-a1/venv/bin",
    PYTHONPATH="/home/ubuntu/GSX-a1",
    FLASK_ENV="production"

[supervisord]
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10 