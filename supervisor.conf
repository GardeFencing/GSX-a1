[program:vidclip]
directory=/home/ubuntu/VidCLIPChatbot
command=/home/ubuntu/VidCLIPChatbot/venv/bin/python server.py
user=ubuntu
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=/home/ubuntu/VidCLIPChatbot/logs/supervisor.err.log
stdout_logfile=/home/ubuntu/VidCLIPChatbot/logs/supervisor.out.log
environment=
    PATH="/home/ubuntu/VidCLIPChatbot/venv/bin",
    PYTHONPATH="/home/ubuntu/VidCLIPChatbot",
    FLASK_ENV="production"

[supervisord]
logfile=/home/ubuntu/VidCLIPChatbot/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10 