; /etc/supervisor/conf.d/vidclip.conf

[program:vidclip]
directory=__GSX_A1_PATH__
command=__GSX_A1_PATH__/venv_py310/bin/gunicorn --workers 4 --threads 2 --worker-class=gthread --bind 0.0.0.0:5000 --timeout 600 --graceful-timeout 300 --keep-alive 30 --max-requests 800 --max-requests-jitter 100 --log-level debug --capture-output --access-logfile __GSX_A1_PATH__/mini_pcm_access.log --error-logfile __GSX_A1_PATH__/mini_pcm_error.log web_app:app
user=ubuntu
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=__GSX_A1_PATH__/mini_pcm_stderr.log
stdout_logfile=__GSX_A1_PATH__/mini_pcm_stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
environment=PYTHONUNBUFFERED=1,PATH="__GSX_A1_PATH__/venv_py310/bin:%(ENV_PATH)s",PYTHONPATH="__GSX_A1_PATH__",LANG=en_US.UTF-8,LC_ALL=en_US.UTF-8,ACCESS_TOKEN="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"

[supervisord]
logfile=__GSX_A1_PATH__/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=debug
